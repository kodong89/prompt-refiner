<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프롬프트 다듬기</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px;
    background: #fafaf7;
    color: #222;
    line-height: 1.6;
  }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 4px; }
  .subtitle { color: #777; font-size: 14px; margin: 0 0 24px; }
  .card {
    background: white;
    border: 1px solid #e5e3dc;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .label { font-size: 12px; color: #777; margin-bottom: 6px; display: block; }
  input[type="password"], textarea {
    width: 100%;
    border: 1px solid #e5e3dc;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    background: white;
  }
  textarea { min-height: 90px; resize: vertical; }
  input:focus, textarea:focus { outline: none; border-color: #888; }
  button {
    background: #1d4ed8;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: #1e40af; }
  button.secondary {
    background: white;
    color: #222;
    border: 1px solid #e5e3dc;
  }
  button.secondary:hover { background: #f5f3ee; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > button { flex: 1; min-width: 100px; }
  .refined-box {
    background: #f0f7ff;
    border-left: 3px solid #1d4ed8;
    border-radius: 6px;
    padding: 14px;
    margin-top: 12px;
    white-space: pre-wrap;
    font-size: 14px;
  }
  .changes { font-size: 12px; color: #555; margin-top: 10px; }
  .changes li { margin: 2px 0; }
  .hidden { display: none; }
  .error {
    background: #fde8e8;
    border-left: 3px solid #d72424;
    padding: 12px;
    border-radius: 6px;
    font-size: 13px;
    color: #8a1c1c;
  }
  .footer-note { font-size: 11px; color: #999; text-align: center; margin-top: 24px; }
  .loading { color: #888; font-size: 13px; font-style: italic; }
  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1f2937;
    color: white;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    pointer-events: none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    z-index: 1000;
    max-width: 90%;
    text-align: center;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast strong { color: #93c5fd; font-weight: 500; }
</style>
</head>
<body>

<h1>프롬프트 다듬기</h1>
<p class="subtitle">편하게 말하시면 AI가 잘 알아듣게 다듬어 드려요</p>

<div class="card">
  <label class="label">Gemini API 키 (한 번만 입력하면 브라우저에 저장됩니다)</label>
  <input type="password" id="apiKey" placeholder="AIza..." />
  <p style="font-size: 11px; color: #999; margin: 6px 0 0;">
    <a href="https://aistudio.google.com/app/apikey" target="_blank" style="color: #1d4ed8;">aistudio.google.com</a>에서 무료로 발급. 다른 사람한테 전송되지 않고 본인 브라우저에만 저장돼요.
  </p>
</div>

<div class="card">
  <label class="label">평소처럼 편하게 적어주세요</label>
  <textarea id="rawInput" placeholder="예: 어 그 우리 회사 매출 떨어졌는데 분석 좀 해줘"></textarea>
  <div style="margin-top: 10px;">
    <button onclick="refine()">다듬기</button>
    <button class="secondary" onclick="document.getElementById('rawInput').value = ''; document.getElementById('result').classList.add('hidden');">지우기</button>
  </div>
</div>

<div id="result" class="card hidden">
  <span class="label">다듬어진 질문</span>
  <div id="refinedText" class="refined-box"></div>
  <ul id="changesMade" class="changes"></ul>

  <div style="margin-top: 14px;">
    <span class="label">버튼 클릭 → 자동 복사 후 새 탭 열림 → Ctrl+V (Mac은 Cmd+V)</span>
    <div class="row">
      <button onclick="sendTo('claude')">Claude로</button>
      <button onclick="sendTo('chatgpt')">ChatGPT로</button>
      <button onclick="sendTo('gemini')">Gemini로</button>
      <button class="secondary" onclick="copyOnly()">복사만</button>
    </div>
  </div>
</div>

<div id="error" class="hidden"></div>

<div id="toast" class="toast"></div>

<p class="footer-note">모든 처리는 본인 브라우저에서 일어납니다. API 키는 외부로 전송되지 않아요. (v3)</p>

<script>
const MODEL = 'gemini-2.5-flash-lite';

const SYSTEM_PROMPT = `당신은 "프롬프트 통역사"입니다.
사람들이 AI에게 두서없이, 모호하게 던진 말을 받아서 AI가 잘 답할 수 있는 명확한 프롬프트로 다시 써주는 역할입니다.

규칙:
1. 사용자의 의도를 절대 왜곡하지 마세요. 명확하게 만들 뿐입니다.
2. 사용자가 말하지 않은 디테일을 함부로 지어내지 마세요.
3. 음성 입력의 필러("어", "음", "그", "뭐냐")는 무시하세요.
4. 6요소를 머릿속에 두되, 사용자가 말한 만큼만 채우세요: 역할, 태스크, 맥락, 입력, 제약, 출력 형식.
5. 한국어 입력이면 한국어로, 영어면 영어로 다듬으세요.

반드시 다음 JSON 형식으로만 응답하세요:
{
  "refined_prompt": "다듬어진 프롬프트",
  "changes_made": ["어떻게 다듬었는지 1~3개 짧은 설명"]
}`;

const apiKeyInput = document.getElementById('apiKey');
const savedKey = localStorage.getItem('gemini_api_key');
if (savedKey) apiKeyInput.value = savedKey;
apiKeyInput.addEventListener('change', () => {
  localStorage.setItem('gemini_api_key', apiKeyInput.value);
});

let currentRefined = '';

async function refine() {
  const apiKey = apiKeyInput.value.trim();
  const rawInput = document.getElementById('rawInput').value.trim();

  hideError();

  if (!apiKey) { showError('API 키를 먼저 입력해주세요.'); return; }
  if (!rawInput) { showError('다듬을 내용을 입력해주세요.'); return; }

  const refinedEl = document.getElementById('refinedText');
  const changesEl = document.getElementById('changesMade');
  refinedEl.innerHTML = '<span class="loading">다듬는 중...</span>';
  changesEl.innerHTML = '';
  document.getElementById('result').classList.remove('hidden');

  try {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${apiKey}`;
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: rawInput }] }],
        systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
        generationConfig: { temperature: 0.3, responseMimeType: 'application/json' }
      })
    });

    if (!response.ok) {
      const errText = await response.text();
      throw new Error(`API 오류 (${response.status}): ${errText}`);
    }

    const data = await response.json();
    const text = data.candidates[0].content.parts[0].text;
    const parsed = JSON.parse(text);

    currentRefined = parsed.refined_prompt;
    refinedEl.textContent = currentRefined;

    if (parsed.changes_made && parsed.changes_made.length) {
      changesEl.innerHTML = '<strong>이렇게 다듬었어요:</strong>' +
        parsed.changes_made.map(c => `<li>${c}</li>`).join('');
    }
  } catch (err) {
    showError(`처리 중 오류: ${err.message}`);
  }
}

async function sendTo(target) {
  if (!currentRefined) return;

  const urls = {
    claude: 'https://claude.ai/new',
    chatgpt: 'https://chatgpt.com/',
    gemini: 'https://gemini.google.com/app'
  };
  const names = {
    claude: 'Claude',
    chatgpt: 'ChatGPT',
    gemini: 'Gemini'
  };

  try {
    await navigator.clipboard.writeText(currentRefined);
    window.open(urls[target], '_blank');
    const isMac = /Mac|iPhone|iPad/.test(navigator.platform);
    const shortcut = isMac ? 'Cmd+V' : 'Ctrl+V';
    showToast(`복사 완료! ${names[target]} 새 탭에서 <strong>${shortcut}</strong>로 붙여넣기`);
  } catch (err) {
    window.open(urls[target], '_blank');
    showToast(`${names[target]} 탭을 열었어요. 자동 복사가 안 됐으니 "복사만" 버튼으로 직접 복사해주세요.`);
  }
}

async function copyOnly() {
  if (!currentRefined) return;
  try {
    await navigator.clipboard.writeText(currentRefined);
    showToast('복사됐어요. 원하는 AI에 붙여넣으세요.');
  } catch (err) {
    showError('복사 실패. 브라우저가 클립보드 접근을 막았어요.');
  }
}

function showToast(html) {
  const toast = document.getElementById('toast');
  toast.innerHTML = html;
  toast.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => {
    toast.classList.remove('show');
  }, 3500);
}

function showError(msg) {
  const el = document.getElementById('error');
  el.className = 'error';
  el.textContent = msg;
}
function hideError() {
  document.getElementById('error').className = 'hidden';
}
</script>
</body>
</html>
